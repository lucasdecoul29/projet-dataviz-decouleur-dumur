
services:
  jupyter:
    image: quay.io/mathbunnyru/pyspark-notebook:c9ecde976a5f
    container_name: divvy-jupyter
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - .:/home/jovyan/work
      - ivy-cache:/home/jovyan/.ivy2
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      S3_ENDPOINT: http://rustfs:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin

  rustfs-init:
    image: alpine:3.20
    user: root
    command: chown -R 10001:10001 /data
    volumes:
      - lake-data:/data

  rustfs:
    image: rustfs/rustfs:latest
    container_name: divvy-rustfs
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - lake-data:/data

  postgres:
    image: postgres:16
    container_name: divvy-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: divvy
      POSTGRES_PASSWORD: divvy
      POSTGRES_DB: divvy
    volumes:
      - pg-data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: divvy-adminer
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  ivy-cache:
  lake-data:
  pg-data:
